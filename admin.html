<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Team Dashboard — Williams Systems LLC</title>
  <meta name="theme-color" content="#0B0C10" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/admin.css" />
</head>
<body class="admin">
  <!-- Not connected -->
  <section class="admin-center" id="configNotice" hidden>
    <div class="login-card">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l3.5 12L12 9l4.5 9L20 6"/></svg></span>
      <h1>Not connected yet</h1>
      <p>The dashboard needs a Supabase project. Run <code>npm run provision</code> and rebuild.</p>
    </div>
  </section>

  <!-- Login -->
  <section class="admin-center" id="loginView" hidden>
    <form class="login-card" id="loginForm" novalidate>
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l3.5 12L12 9l4.5 9L20 6"/></svg></span>
      <h1>Team sign in</h1>
      <p>Inquiries, files, and notes for Williams Systems LLC.</p>
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" name="email" autocomplete="username" required />
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
      <a class="login-back" href="./">← Back to website</a>
    </form>
  </section>

  <!-- App -->
  <div class="admin-app" id="appView" hidden>
    <header class="admin-top">
      <a href="./" class="brand" aria-label="Williams Systems website">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l3.5 12L12 9l4.5 9L20 6"/></svg></span>
        <span class="brand-name">Williams<span class="brand-thin"> Systems</span></span>
      </a>
      <span class="admin-title mono">Inquiries</span>
      <span class="live mono" id="liveBadge" title="New inquiries appear automatically"><i></i>Live</span>
      <div class="admin-top-actions">
        <span class="admin-user" id="userEmail"></span>
        <button class="btn btn-ghost btn-sm" id="refreshBtn" type="button">Refresh</button>
        <button class="btn btn-ghost btn-sm" id="signOutBtn" type="button">Sign out</button>
      </div>
    </header>

    <div class="admin-main" id="adminMain">
      <aside class="inbox" aria-label="Inquiries">
        <div class="inbox-tools">
          <input type="search" id="search" class="search" placeholder="Search name, email, company…" aria-label="Search inquiries" />
          <div class="tabs" id="statusTabs" role="tablist"></div>
        </div>
        <ul class="inquiry-list" id="inquiryList"></ul>
        <p class="list-empty" id="listEmpty" hidden>No inquiries here yet.</p>
      </aside>

      <section class="detail" id="detail" aria-live="polite">
        <div class="detail-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <p>Select an inquiry to see details, files, and notes.</p>
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/js/admin.js"></script>
</body>
</html>
